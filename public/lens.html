<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob: mediastream:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'">
  <title>ScreenMagnify3</title>
  <link rel="stylesheet" href="css/save.css">
  <style>
    :root { --ring: url(assets/ring-carbon.png); }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; cursor: crosshair; user-select: none; }
    img { position: absolute; display: block; max-width: none; pointer-events: none; }
    #bg, #bgv { left: 0; top: 0; width: 100%; height: 100%; }
    #dim { position: fixed; inset: 0; background: rgba(0, 0, 0, .28); display: none; pointer-events: none; }
    body.bold #dim, body.classic #dim { display: block; }
    #lens { position: absolute; z-index: 1; pointer-events: none; }
    #view { position: absolute; inset: 0; overflow: hidden; box-sizing: border-box; }
    /* Frame styles. The frame is a border on #view plus shadows; classic adds a handle and glare. */
    body.clean #view { border: 2px solid #7c6af7; box-shadow: 0 6px 24px rgba(0,0,0,.55); }
    body.bold #view { border: 5px solid #fff; box-shadow: 0 0 0 3px #7c6af7, 0 0 0 6px #fff, 0 0 28px 8px rgba(124,106,247,.9), 0 10px 30px rgba(0,0,0,.7); }
    /* Classic style: a cartoon magnifier (black outline, light ring, blue tinted glass, brown handle).
       --t is the ring thickness and --hw the handle width, both set from the lens size in lens.js. */
    body.classic #view { border: 3px solid #111; box-shadow: none; }
    #ring { position: absolute; inset: calc(var(--t, 14px) * -1); display: none; box-sizing: border-box; pointer-events: none;
      border: 3px solid #111; background: var(--ring) center / cover; box-shadow: 0 8px 20px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.25); }
    /* Soft light from the upper left over the ring material. */
    #ring::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(135deg, rgba(255,255,255,.3), rgba(255,255,255,0) 45%, rgba(0,0,0,.25)); }
    body.classic #ring { display: block; }
    #zc, #zc2 { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
    /* Same look as the magnification HUD of ScreenMagnify, in the lower right corner of the lens. */
    #badge { position: absolute; right: 10px; bottom: 8px; z-index: 3; color: #fff; font-weight: 800; letter-spacing: -1.4px;
      font-variant-numeric: tabular-nums; text-shadow: 0 3px 18px rgba(0, 0, 0, .82); background: rgba(0, 0, 0, .62); padding: 0 10px 2px; opacity: 0; transform: translateY(6px);
      transition: opacity 220ms ease, transform 220ms ease; pointer-events: none; white-space: nowrap; }
    #badge.show { opacity: .93; transform: translateY(0); }
    #glare { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; display: none; }
    body.classic #glare { display: block; background: rgba(70, 140, 230, .10); }
    #handle { position: absolute; display: none; width: var(--hw, 24px); height: 70px; box-sizing: border-box; border: 3px solid #111;
      border-radius: calc(var(--hw, 24px) * .4); transform-origin: 50% 0; --neck: calc(var(--hw, 24px) * 1.3);
      /* The neck is made of the ring material, so ring and handle read as one piece. */
      background: var(--ring) center top / 100% var(--neck) no-repeat,
        linear-gradient(to bottom, transparent var(--neck), #111 var(--neck), #111 calc(var(--neck) + 3px), #b9803a calc(var(--neck) + 3px));
      box-shadow: 0 5px 10px rgba(0,0,0,.45); }
    /* Flared collar at the joint: wider than the grip and tucked under the ring. */
    #handle::before { content: ''; position: absolute; left: calc(var(--hw, 24px) * -.3); top: -3px; width: calc(var(--hw, 24px) * 1.6);
      height: calc(var(--hw, 24px) * .75); box-sizing: border-box; border: 3px solid #111; border-radius: 6px; background: var(--ring) center / cover; }
    /* Highlight stripe along the grip. */
    #handle::after { content: ''; position: absolute; left: 22%; width: 18%; top: calc(var(--neck) + 9px); bottom: 8px; border-radius: 4px;
      background: rgba(255, 222, 160, .55); }
    body.classic #handle { display: block; }
    #save-modal { z-index: 50; }
    #hint { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); padding: 8px 16px; border-radius: 8px;
      background: rgba(0,0,0,.72); color: #fff; font: 15px sans-serif; pointer-events: none; }
    #warn { color: #ffd27a; opacity: 1 !important; }
    #hint small { display: block; margin-top: 3px; font-size: 12px; opacity: .75; text-align: center; }
  </style>
</head>
<body class="clean">
  <img id="bg" alt="">
  <video id="bgv" muted playsinline style="display:none"></video>
  <div id="dim"></div>
  <div id="lens"><div id="ring"></div><div id="view"><canvas id="zc"></canvas><canvas id="zc2"></canvas><div id="glare"></div><div id="badge"></div></div><div id="handle"></div></div>
  <div id="hint">화면 Freezed, Press ESC to continue<small>휠: 확대/축소 · Ctrl+휠: 돋보기 크기 · 우클릭: 종료 · Ctrl+S: 저장</small><small id="warn"></small><small id="ai"></small></div>
  <div class="modal-backdrop hidden" id="save-modal">
    <div class="save-card" role="dialog" aria-modal="true" aria-labelledby="save-title">
      <header class="modal-head">
        <strong id="save-title">이미지 저장</strong>
        <button class="icon-button" id="save-close" title="닫기" aria-label="닫기">
          <svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17"></path></svg>
        </button>
      </header>
      <div class="save-body">
        <aside class="preset-pane">
          <div class="pane-title">빠른 위치</div>
          <div class="save-presets" id="save-presets"></div>
        </aside>
        <section class="browser-pane">
          <div class="path-row">
            <button class="square-button" id="save-up" title="상위 폴더" aria-label="상위 폴더">
              <svg viewBox="0 0 24 24"><path d="M12 19V5M6.5 10.5 12 5l5.5 5.5"></path></svg>
            </button>
            <input class="path-input" id="save-path" spellcheck="false" aria-label="현재 폴더">
            <button class="square-button" id="save-go" title="이동" aria-label="이동">
              <svg viewBox="0 0 24 24"><path d="M5 12h13M13 6.5 18.5 12 13 17.5"></path></svg>
            </button>
            <button class="square-button" id="save-new-folder" title="새 폴더" aria-label="새 폴더">
              <svg viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-15z"></path><path d="M12 11v5M9.5 13.5h5"></path></svg>
            </button>
          </div>
          <div class="new-folder-row hidden" id="new-folder-row">
            <input id="new-folder-name" placeholder="새 폴더 이름" maxlength="80">
            <button id="new-folder-create">만들기</button>
            <button id="new-folder-cancel">취소</button>
          </div>
          <div class="file-list" id="save-list"></div>
        </section>
      </div>
      <footer class="save-footer">
        <div class="preview-box">
          <img id="save-preview" alt="저장 미리보기">
          <span>미리보기</span>
        </div>
        <div class="name-box">
          <label for="save-name">파일 이름</label>
          <div class="name-row">
            <input id="save-name" spellcheck="false" maxlength="120">
            <span>.png</span>
          </div>
          <small>같은 이름이 있으면 자동으로 번호가 붙습니다.</small>
        </div>
        <div class="save-actions">
          <button class="ghost-button" id="save-cancel">취소</button>
          <button class="primary-button" id="save-confirm">저장</button>
        </div>
      </footer>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="js/nis-coefs.js"></script>
  <script src="js/methods.js"></script>
  <script src="js/upscaler.js"></script>
  <script src="js/cpu-scaler.js"></script>
  <script src="js/save-dialog.js"></script>
  <script src="js/lens.js"></script>
</body>
</html>
